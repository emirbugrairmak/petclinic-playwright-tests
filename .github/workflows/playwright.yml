name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FRONTEND_COMMIT: 6e70caf78572f4a9dc74c8ba2cb119f237e14980
  BACKEND_IMAGE: springcommunity/spring-petclinic-rest@sha256:d092779e874fd680357763a6f219d97afb419dca13f6a750ccfb8ac63c610986
  FRONTEND_NODE_IMAGE: node:18@sha256:c6ae79e38498325db67193d391e6ec1d224d96c693a8a4d943498556716d3783
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:9966/petclinic/api
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.14.1
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start backend
      run: |
        docker run -d \
          --name petclinic-backend \
          -p 9966:9966 \
          "$BACKEND_IMAGE"
    - name: Wait for backend
      run: |
        for attempt in {1..60}; do
          if curl --fail --silent --max-time 3 \
            http://localhost:9966/petclinic/api/owners > /dev/null; then
            echo "Backend hazır."
            exit 0
          fi

          echo "Backend bekleniyor... Deneme: $attempt"
          sleep 2
        done

        echo "Backend zamanında hazır olmadı."
        docker logs petclinic-backend
        exit 1
    - name: Clone frontend
      run: |
        git init frontend
        git -C frontend remote add origin https://github.com/bondar-artem/petclinic-angular.git
        git -C frontend fetch --depth 1 origin "$FRONTEND_COMMIT"
        git -C frontend checkout --detach FETCH_HEAD
    - name: Install frontend dependencies
      run: |
        docker run --rm \
          -v "$PWD/frontend:/app" \
          -w /app \
          "$FRONTEND_NODE_IMAGE" \
          npm ci
    - name: Run Playwright tests
      run: npm run test -- --grep-invert @visual
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30
    - name: Stop application containers
      if: always()
      run: |
        docker rm -f petclinic-backend petclinic-frontend

  visual:
    name: Visual Tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:9966/petclinic/api
      SKIP_WEBSERVER: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Start backend
        run: |
          docker run -d \
            --name petclinic-backend \
            -p 9966:9966 \
            "$BACKEND_IMAGE"
      - name: Wait for backend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 3 \
              http://localhost:9966/petclinic/api/owners > /dev/null; then
              echo "Backend hazır."
              exit 0
            fi

            echo "Backend bekleniyor... Deneme: $attempt"
            sleep 2
          done

          echo "Backend zamanında hazır olmadı."
          docker logs petclinic-backend
          exit 1
      - name: Clone frontend
        run: |
          git init frontend
          git -C frontend remote add origin https://github.com/bondar-artem/petclinic-angular.git
          git -C frontend fetch --depth 1 origin "$FRONTEND_COMMIT"
          git -C frontend checkout --detach FETCH_HEAD
      - name: Install frontend dependencies
        run: |
          docker run --rm \
            -v "$PWD/frontend:/app" \
            -w /app \
            "$FRONTEND_NODE_IMAGE" \
            npm ci
      - name: Start frontend
        run: |
          docker run -d \
            --name petclinic-frontend \
            -p 4200:4200 \
            -v "$PWD/frontend:/app" \
            -w /app \
            -e NG_CLI_ANALYTICS=false \
            "$FRONTEND_NODE_IMAGE" \
            npm start -- --host 0.0.0.0 --port 4200 --live-reload=false
      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 3 \
              http://localhost:4200/ > /dev/null; then
              echo "Frontend hazır."
              exit 0
            fi

            echo "Frontend bekleniyor... Deneme: $attempt"
            sleep 2
          done

          echo "Frontend zamanında hazır olmadı."
          docker logs petclinic-frontend
          exit 1
      - name: Run visual tests in Playwright container
        run: |
          docker run --rm --init \
            --platform linux/amd64 \
            --ipc=host \
            --network host \
            -v "$PWD:/app" \
            -w /app \
            -e CI=true \
            -e BASE_URL \
            -e API_URL \
            -e SKIP_WEBSERVER \
            "$PLAYWRIGHT_IMAGE" \
            bash -c 'npm ci && npm run typecheck && npm run test:visual'
      - name: Upload visual test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
      - name: Stop application containers
        if: always()
        run: |
          docker rm -f petclinic-backend petclinic-frontend
